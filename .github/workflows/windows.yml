name: Windows RX
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-rx-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      release_name: ${{ steps.package.outputs.release_name }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - run: cargo check --lib --no-default-features --target wasm32-unknown-unknown --locked
      - name: Package Windows x64
        id: package
        shell: pwsh
        run: ./scripts/package-nightly.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: QuasarSDR-Windows-x64-RX
          path: target/nightly/QuasarSDR-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
  nightly:
    name: Publish NIGHTLY
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: QuasarSDR-Windows-x64-RX
          path: dist
      - uses: actions/github-script@v7
        env:
          RELEASE_NAME: ${{ needs.build.outputs.release_name }}
          RELEASE_SHA256: ${{ needs.build.outputs.sha256 }}
        with:
          script: |
            const publish = require('./scripts/publish-nightly.cjs');
            await publish({ github, context, core });
