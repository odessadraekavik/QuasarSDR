[package]
name = "quasar-sdr"
version = "0.1.0"
# Édition du langage Rust, pas l'année du projet.
edition = "2021"
description = "Scanner SDR multi-VFO : base desktop Windows en Rust"
license = "GPL-3.0-only"
repository = "https://github.com/odessadraekavik/QuasarSDR"
readme = "README.md"

[lib]
name = "quasar_sdr"
path = "src/lib.rs"

[[bin]]
name = "quasar-sdr"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:cpal", "dep:crossbeam-channel", "dep:crossbeam-queue", "dep:libloading"]

[dependencies]
num-complex = "0.4.6"
rustfft = "6.4.1"
nnnoiseless = { version = "=0.5.2", default-features = false }

# Versions d'API volontairement fixées pour ce squelette.
# Le noyau DSP reste indépendant du système et de l'interface graphique.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
cpal = { version = "=0.15.3", optional = true }
crossbeam-channel = { version = "0.5.15", optional = true }
crossbeam-queue = { version = "0.3.12", optional = true }
libloading = { version = "0.8.9", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
